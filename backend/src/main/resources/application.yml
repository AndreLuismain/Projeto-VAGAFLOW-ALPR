server:
  port: 8080

spring:
  application:
    name: vagaflow-alpr-backend
  datasource:
    url: jdbc:h2:mem:vagaflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

vagaflow:
  pricing:
    platform-fixed-fee-brl: 1.00
    no-show-penalty-ratio: 0.50
    reservation-ttl-minutes: 15
    mandatory-warning-message: "Se em 15minutos nao estiver na vaga é cobrado metade do valor minimo!"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
